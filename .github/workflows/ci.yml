name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@v2
        with:
          install: true # Автоматически запускает mise install

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: make lint

      - name: Run Tests with Coverage
        run: make test-coverage